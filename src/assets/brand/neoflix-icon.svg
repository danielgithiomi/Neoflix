        <rect x="180" y="126" width="16" height="22" rx="4"/>
        <rect x="180" y="173.6" width="16" height="22" rx="4"/>
        <rect x="180" y="221.2" width="16" height="22" rx="4"/>
        <rect x="180" y="268.8" width="16" height="22" rx="4"/>
        <rect x="180" y="316.4" width="16" height="22" rx="4"/>
        <rect x="180" y="364" width="16" height="22" rx="4"/>
